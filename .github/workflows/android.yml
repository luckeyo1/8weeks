# 안드로이드 앱(TWA) 빌드 — android/ 폴더가 바뀌면 자동 실행, Actions 탭에서 수동 실행도 가능.
#
# 업로드 키 Secrets (Settings → Secrets and variables → Actions) 가 있으면
# 플레이스토어에 올릴 서명된 .aab 와 테스트 설치용 서명된 .apk 를 만든다.
#   ANDROID_KEYSTORE_BASE64   업로드 키(.jks)를 base64 로 인코딩한 한 줄
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭 (upload)
#   ANDROID_KEY_PASSWORD      키 비밀번호
# Secrets 가 없으면 빌드 검증용 debug APK 와 서명 안 된 .aab 만 만든다.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # 플레이스토어 버전 코드: 실행할 때마다 1씩 늘어나는 번호를 쓴다
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 업로드 키 준비
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: 빌드
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TASKS="assembleDebug bundleRelease"
          if [ "$HAS_KEYSTORE" = "true" ]; then TASKS="$TASKS assembleRelease"; fi
          # 의존성 서버의 일시적 오류(429 등)에 대비해 최대 3번 시도
          for attempt in 1 2 3; do
            if ./gradlew $TASKS -PversionCode="$VERSION_CODE"; then exit 0; fi
            echo "::warning::빌드 실패 (시도 $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          exit 1

      - name: 결과 확인 (병합된 매니페스트 / 서명)
        run: |
          echo "::group::merged AndroidManifest.xml (release)"
          find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*release*' | head -1 | xargs cat
          echo "::endgroup::"
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/*/
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "업로드 키 서명 확인 (assetlinks.json 의 지문과 같아야 함):"
            keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E 'Owner|SHA256'
          else
            echo "::warning::업로드 키 Secrets 가 없어 .aab 가 서명되지 않았습니다. 플레이스토어 업로드 전 android/README.md 의 Secrets 를 등록하세요."
          fi

      - name: 플레이스토어 업로드용 .aab
        uses: actions/upload-artifact@v4
        with:
          name: prayer-together-${{ env.HAS_KEYSTORE == 'true' && 'signed' || 'unsigned' }}-aab-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 테스트 설치용 .apk
        uses: actions/upload-artifact@v4
        with:
          name: prayer-together-apk-v${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
