org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# 앱 버전 (플레이스토어에 보이는 이름). 출시할 때마다 올려주세요.
appVersionName=1.0.0
# 버전 코드 기본값. GitHub Actions 빌드는 실행 번호(run_number)로 자동 증가시킵니다.
appVersionCode=1

# 저장소(Maven Central 등)의 일시적 오류(429/5xx)에 더 끈질기게 재시도
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
